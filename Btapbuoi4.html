<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biểu Mẫu Đăng Kí Ứng Tuyển</title>
</head><style>
    .form-container{
        background-color: rgb(255, 255, 255);
            width: 100%;
            max-width: 500px;
            border: 1px solid rgb(198, 208, 226);
            border-radius: 10px;
            padding: 20px;
            margin: 20px auto;}
    h2{
        text-align: center;
         color: #000000;
         margin-bottom: 20px;}
    h3{
        color: #000000;
          margin-bottom: 10px;}
    label{
        display: block;
          font-weight: normal;
          margin-bottom: 1px;
          color: #000000;}
    input[type="text"], input[type="tel"], 
    textarea{
        width: 100%;
          padding: 8px;
          border: 1px solid #ccc;
          border-radius: 4px;}
    input[type="file"] {
        width: 100%;
          padding: 8px;
          border: 1px solid #ccc;
          border-radius: 10px;
          box-sizing: border-box;}
    textarea {
        resize: vertical;
          height: 100px;
          border-radius: 4px;}
    button {
        width: 100%;
          background-color: #007bff;
          color: white;
          border: none;
          padding: 12px;
          border-radius: 6px;
          font-size: 16px;
          cursor: pointer;
          margin-top: 10px;}
        button:hover {
            background-color: #0056b3;}
</style></head>
<body style="background-color:aliceblue">
  <div class="form-container">
    <form> 
        <h2>ĐƠN ĐĂNG KÝ ỨNG TUYỂN</h2>
    
<div class="form-group">
    <h3>Thông tin cá nhân(Personal Information)</h3>
        <label for="fname">Họ và tên(Full name)</label>
         <br>
         <input type="text" id="fname"name="fname"><br>
       <label for="email">Địa chỉ email (Email Address)</label>
         <br>
         <input type="text" id="email" name="email">
         <br>
       <label for="phone number">Số điện thoại(Phone)</label>
         <br>
         <input type="tel" id="number" name="phone"><br>
<div class="form-group">
    <h3 >Đơn đăng kí(Application)</h3>
        <label for="coverletter">Thư ứng tuyển (Cover Letter):</label>
         <textarea id="coverletter" name="coverletter" placeholder="Tại sao bạn phù hợp vị trí này?"></textarea>
        <label for="resume">Tải lên CV/Resume(Upload Resume/CV)</label>  
         <input type="file" id="resume" name="resume">
</div>
    <button type="submit">Gửi đơn ứng tuyển</button>
    </form>
    </body>
</html>
